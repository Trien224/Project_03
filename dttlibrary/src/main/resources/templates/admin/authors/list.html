<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(title='Author Management', content=~{::content})}">

<div th:fragment="content">

    <h3>✍️ Author Management</h3>

    <div style="text-align: right; margin-bottom: 10px;">
        <a href="/admin/authors/create" class="btn">+ Add New Author</a>
    </div>

    <!-- Reusable Messages Fragment -->
    <div th:replace="~{fragments/common-fragments :: messages}"></div>

    <table class="table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Biography</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${authors}">
                <td th:text="${a.name}" style="font-weight: bold;">Author Name</td>
                <td th:text="${a.bio != null ? #strings.abbreviate(a.bio, 100) : ''}">Biography snippet...</td>
                <td align="center">
                    <a th:href="@{/admin/authors/edit/{id}(id=${a.id})}" class="btn">Edit</a>
                    <a th:href="@{/admin/authors/delete/{id}(id=${a.id})}" class="btn" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</html>

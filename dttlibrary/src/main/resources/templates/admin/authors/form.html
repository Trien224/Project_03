<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin | Author Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="sidebar">
        <h4>DTT Library</h4>
        <a href="/admin">Dashboard</a>
        <a href="/admin/books">Books</a>
        <a href="/admin/book-items">Book Items</a>
        <a href="/admin/categories">Categories</a>
        <a href="/admin/authors" class="active">Authors</a>
        <a href="/admin/borrowings">Borrowings</a>
        <a href="/logout">Logout</a>
    </div>

    <div class="content">
        <h3>✍️ Author Form</h3>

        <form th:action="@{/admin/authors/save}" th:object="${author}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="name">Name</label>
                <input id="name" class="form-control" th:field="*{name}" placeholder="Enter author name" required>
            </div>

            <div class="form-group">
                <label for="bio">Biography</label>
                <textarea id="bio" class="form-control" th:field="*{bio}" rows="4" placeholder="Short author biography"></textarea>
            </div>

            <div>
                <button type="submit" class="btn btn-primary">💾 Save</button>
                <a class="btn" href="/admin/authors">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

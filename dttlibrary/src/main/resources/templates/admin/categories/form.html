<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(title='Category Form', content=~{::content})}">

<div th:fragment="content">

    <h3 th:text="${category.id == null} ? '➕ Add New Category' : '✏️ Edit Category'"></h3>

    <!-- Reusable Messages Fragment -->
    <div th:replace="~{fragments/common-fragments :: messages}"></div>

    <fieldset style="border: 2px inset white; padding: 15px;">
        <legend style="font-size: 16px; font-weight: bold; color: navy;">Category Details</legend>

        <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <table>
                <tr>
                    <td><label for="name">Name:</label></td>
                    <td><input id="name" th:field="*{name}" class="form-control" required size="40"></td>
                </tr>
                <tr>
                    <td><label for="slug">Slug:</label></td>
                    <td><input id="slug" th:field="*{slug}" class="form-control" size="40" placeholder="auto-generated if empty"></td>
                </tr>
                <tr>
                    <td valign="top"><label for="description">Description:</label></td>
                    <td><textarea id="description" th:field="*{description}" class="form-control" rows="4" cols="38"></textarea></td>
                </tr>
            </table>

            <div style="margin-top: 15px;">
                <button type="submit" class="btn">Save Category</button>
                <a href="/admin/categories" class="btn">Cancel</a>
            </div>
        </form>
    </fieldset>

</div>
</html>

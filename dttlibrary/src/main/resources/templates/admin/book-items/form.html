<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(title='Book Item Form', content=~{::content})}">

<div th:fragment="content">

    <h3 th:text="${item.id == null} ? '📦 Add New Book Item' : '✏️ Edit Book Item'"></h3>

    <!-- Reusable Messages Fragment -->
    <div th:replace="~{fragments/common-fragments :: messages}"></div>

    <fieldset style="border: 2px inset white; padding: 15px;">
        <legend style="font-size: 16px; font-weight: bold; color: navy;">Item Details</legend>

        <form th:action="@{/admin/book-items/save}" th:object="${item}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <table>
                <tr>
                    <td><label for="bookId">Book:</label></td>
                    <td>
                        <select id="bookId" name="bookId" class="form-select" required>
                            <option value="">-- Select Book --</option>
                            <option th:each="b : ${books}"
                                    th:value="${b.id}"
                                    th:text="${b.title}"
                                    th:selected="${item.book != null and item.book.id == b.id}"></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="barcode">Barcode:</label></td>
                    <td><input id="barcode" th:field="*{barcode}" class="form-control" required size="40"></td>
                </tr>
                <tr>
                    <td><label for="status">Status:</label></td>
                    <td>
                        <select id="status" th:field="*{status}" class="form-select">
                            <option th:each="s : ${T(com.dttlibrary.model.BookItem.Status).values()}"
                                    th:value="${s}"
                                    th:text="${s}"></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="location">Location:</label></td>
                    <td><input id="location" th:field="*{location}" class="form-control" size="40"></td>
                </tr>
                <tr>
                    <td valign="top"><label for="notes">Notes:</label></td>
                    <td><textarea id="notes" th:field="*{notes}" class="form-control" rows="3" cols="38"></textarea></td>
                </tr>
            </table>

            <div style="margin-top: 15px;">
                <button type="submit" class="btn">Save Item</button>
                <a th:href="${item.book != null ? '/admin/books/edit/' + item.book.id : '/admin/book-items'}" class="btn">Cancel</a>
            </div>
        </form>
    </fieldset>

</div>
</html>

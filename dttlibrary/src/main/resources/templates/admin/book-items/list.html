<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(title='Book Item Management', content=~{::content})}">

<div th:fragment="content">

    <h3>📦 Book Item Management</h3>

    <div style="text-align: right; margin-bottom: 10px;">
        <a href="/admin/book-items/create" class="btn">+ Add New Item</a>
    </div>

    <!-- Messages -->
    <div th:if="${successMessage}" style="color: green; border: 1px solid green; padding: 5px; margin-bottom: 10px;" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" style="color: red; border: 1px solid red; padding: 5px; margin-bottom: 10px;" th:text="${errorMessage}"></div>

    <table class="table">
        <thead>
            <tr>
                <th>Book Title</th>
                <th>Barcode</th>
                <th>Status</th>
                <th>Location</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="i : ${items}">
                <td th:text="${i.book?.title}"></td>
                <td th:text="${i.barcode}"></td>
                <td th:text="${i.status}"></td>
                <td th:text="${i.location}"></td>
                <td align="center">
                    <a th:href="@{/admin/book-items/edit/{id}(id=${i.id})}" class="btn">Edit</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</html>

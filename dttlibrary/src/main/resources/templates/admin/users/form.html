<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin | User Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="sidebar">
        <h4>DTT Library</h4>
        <a href="/admin">Dashboard</a>
        <a href="/admin/books">Books</a>
        <a href="/admin/book-items">Book Items</a>
        <a href="/admin/categories">Categories</a>
        <a href="/admin/authors">Authors</a>
        <a href="/admin/borrowings">Borrowings</a>
        <a href="/admin/users" class="active">Users</a>
        <hr>
        <a href="/logout">Logout</a>
    </div>

    <div class="content">
        <h3 th:text="${user.id == null} ? '➕ Add User' : '✏️ Edit User'"></h3>

        <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="form-group">
                <label>Username</label>
                <input class="form-control" th:field="*{username}" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" th:field="*{password}" th:placeholder="${user.id == null} ? 'Required' : 'Leave blank to keep current'" />
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input class="form-control" th:field="*{fullName}">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input class="form-control" th:field="*{email}">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input class="form-control" th:field="*{phone}">
            </div>

            <div>
                <button type="submit" class="btn btn-primary">💾 Save User</button>
                <a href="/admin/users" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

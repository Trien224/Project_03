<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(title='User Form', content=~{::content})}">

<div th:fragment="content">

    <h3 th:text="${user.id == null} ? '👥 Add New User' : '✏️ Edit User'"></h3>

    <!-- Reusable Messages Fragment -->
    <div th:replace="~{fragments/common-fragments :: messages}"></div>

    <fieldset style="border: 2px inset white; padding: 15px;">
        <legend style="font-size: 16px; font-weight: bold; color: navy;">User Details</legend>

        <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <table>
                <tr>
                    <td><label for="username">Username:</label></td>
                    <td><input id="username" th:field="*{username}" class="form-control" required size="40"></td>
                </tr>
                <tr>
                    <td><label for="password">Password:</label></td>
                    <td><input id="password" type="password" th:field="*{password}" class="form-control" size="40" th:placeholder="${user.id == null} ? 'Required' : 'Leave blank to keep current'"></td>
                </tr>
                <tr>
                    <td><label for="fullName">Full Name:</label></td>
                    <td><input id="fullName" th:field="*{fullName}" class="form-control" size="40"></td>
                </tr>
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td><input id="email" th:field="*{email}" class="form-control" size="40"></td>
                </tr>
                <tr>
                    <td><label for="phone">Phone:</label></td>
                    <td><input id="phone" th:field="*{phone}" class="form-control" size="40"></td>
                </tr>
                <tr>
                    <td valign="top"><label>Roles:</label></td>
                    <td>
                        <fieldset style="border: 1px inset white; padding: 5px;">
                            <th:block th:each="role : ${allRoles}">
                                <input type="checkbox" name="roleIds" th:value="${role.id}" th:id="${'role' + role.id}"
                                       th:checked="${user.roles != null and user.roles.contains(role)}">
                                <label th:for="${'role' + role.id}" th:text="${role.roleName}"></label>
                                <br>
                            </th:block>
                        </fieldset>
                    </td>
                </tr>
            </table>

            <div style="margin-top: 15px;">
                <button type="submit" class="btn">Save User</button>
                <a href="/admin/users" class="btn">Cancel</a>
            </div>
        </form>
    </fieldset>

</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(title='User Management', content=~{::content})}">

<div th:fragment="content">

    <h3>👥 User Management</h3>

    <div style="text-align: right; margin-bottom: 10px;">
        <a href="/admin/users/create" class="btn">+ Add New User</a>
    </div>

    <!-- Reusable Messages Fragment -->
    <div th:replace="~{fragments/common-fragments :: messages}"></div>

    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Roles</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.username}" style="font-weight: bold;"></td>
                <td th:text="${u.fullName}"></td>
                <td th:text="${u.email}"></td>
                <td>
                    <span th:each="r : ${u.roles}"
                          th:text="${r.roleName}"
                          style="background: navy; color: white; padding: 2px 4px; margin-right: 2px;">
                    </span>
                </td>
                <td align="center">
                    <a th:href="@{/admin/users/edit/{id}(id=${u.id})}" class="btn">Edit</a>
                    <a th:href="@{/admin/users/delete/{id}(id=${u.id})}" class="btn" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - DTT Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ===== RETRO REGISTER STYLE ===== */
        body {
            background-color: #008080; /* Teal */
            font-family: "MS Sans Serif", "Verdana", sans-serif;
            font-size: 14px;
        }

        .register-dialog {
            width: 400px;
            background-color: #C0C0C0; /* Silver */
            border: 2px outset white;
            padding: 3px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
        }

        .dialog-title-bar {
            background: navy;
            color: white;
            padding: 3px 5px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dialog-title-bar .close-button {
            background-color: #C0C0C0;
            border: 1px outset white;
            color: black;
            font-family: "MS Sans Serif", sans-serif;
            font-weight: bold;
            width: 16px;
            height: 14px;
            line-height: 12px;
            text-align: center;
        }

        .dialog-content {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .form-group label {
            display: inline-block;
            width: 100px;
            text-align: right;
            margin-right: 10px;
        }

        .form-control-retro {
            border: 2px inset white;
            background-color: white;
            padding: 3px;
            width: calc(100% - 110px);
        }

        .button-pane {
            text-align: center;
            margin-top: 20px;
        }

        .btn-retro {
            background-color: #C0C0C0;
            border: 2px outset white;
            color: black;
            font-weight: bold;
            padding: 3px 20px;
            text-decoration: none;
            margin: 0 5px;
        }

        .btn-retro:active {
            border: 2px inset white;
        }

        .login-link {
            margin-top: 15px;
            font-size: 12px;
            text-align: center;
        }
        .login-link a {
            color: blue;
        }
    </style>
</head>

<body>

<div class="register-dialog">
    <!-- Title Bar -->
    <div class="dialog-title-bar">
        <span>Create New User</span>
        <div class="close-button">X</div>
    </div>

    <!-- Content -->
    <div class="dialog-content">
        <form th:action="@{/register}" th:object="${user}" method="post" novalidate style="width: 100%;">

            <div style="text-align: center; margin-bottom: 15px;">
                <img src="https://win98icons.alexmeub.com/icons/png/user_add-1.png" alt="Add User Icon" width="32">
                <p>Create a new account for DTT Library.</p>
            </div>

            <div class="form-group">
                <label for="username">Username:</label>
                <input id="username" type="text" class="form-control-retro" th:field="*{username}" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input id="password" type="password" class="form-control-retro" th:field="*{password}" required>
            </div>
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input id="fullName" type="text" class="form-control-retro" th:field="*{fullName}">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input id="email" type="email" class="form-control-retro" th:field="*{email}">
            </div>

            <div class="button-pane">
                <button type="submit" class="btn-retro">Register</button>
                <button type="button" class="btn-retro" onclick="window.location.href='/login'">Cancel</button>
            </div>

            <div class="login-link">
                Already have an account? <a href="/login">Click here to log in.</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>

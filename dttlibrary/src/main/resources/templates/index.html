<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DTT Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="content">
        <section class="hero">
            <h1>📘 DTT Library</h1>
            <p>Kho tri thức mở – mượn sách dễ dàng, nhanh chóng</p>
            <div class="mt-4">
                <a th:href="@{/books}" class="btn btn-primary">
                    📚 Xem Toàn Bộ Sách
                </a>
            </div>
        </section>

        <section class="my-5">
            <h3 class="mb-4">📖 Sách mới</h3>
            <div class="row">
                <div class="col-md-3" th:each="book : ${newBooks}">
                    <div class="card book-card">
                        <img th:if="${book.images != null and !book.images.isEmpty()}"
                             th:src="@{${book.images[0].url}}"
                             class="img-fluid">
                        <h6 th:text="${book.title}"></h6>
                        <small class="text-muted" th:if="${book.author != null}">
                            Tác giả: <span th:text="${book.author.name}"></span>
                        </small>
                        <a th:href="@{/books/{id}(id=${book.id})}"
                           class="btn btn-sm">
                            Xem chi tiết
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<footer>
    <div class="container text-center">
        <p>© 2025 DTT Library</p>
        <small>Email: contact@dttlibrary.vn | Phone: 0123 456 789</small>
    </div>
</footer>

</body>
</html>

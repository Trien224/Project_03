<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/../layout/user-layout :: layout(title=${pageTitle}, content=~{::content})}">

<div th:fragment="content">

    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color: navy; text-decoration: underline;" th:text="${pageTitle} ?: 'Tất cả sách'"></h2>
    </div>

    <div th:if="${books.isEmpty()}" style="border: 1px dashed gray; padding: 20px; text-align: center;">
        <p>Không tìm thấy cuốn sách nào phù hợp.</p>
    </div>

    <table th:if="${!books.isEmpty()}" width="100%" cellpadding="10">
        <tr>
            <!-- Sử dụng vòng lặp 4 cột của Thymeleaf -->
            <th:block th:each="book, iterStat : ${books}">
                <td align="center" valign="top" width="25%" style="padding-bottom: 20px;">
                    <div style="border: 2px outset white; padding: 10px; background: #D3D3D3; height: 100%;">
                        <a th:href="@{/user/books/{id}(id=${book.id})}">
                            <img th:if="${book.images != null and !book.images.isEmpty()}"
                                 th:src="@{${book.images[0].url}}"
                                 width="120" height="180" style="border: 1px solid black; object-fit: cover;">
                            <img th:if="${book.images == null or book.images.isEmpty()}"
                                 src="https://via.placeholder.com/120x180?text=No+Image"
                                 width="120" height="180" style="border: 1px solid black;">
                        </a>
                        <br>
                        <a th:href="@{/user/books/{id}(id=${book.id})}" style="font-size: 14px; font-weight: bold; text-decoration: none;" th:text="${book.title}">
                            Book Title
                        </a>
                        <br>
                        <small th:if="${book.author != null}" th:text="${book.author.name}" style="font-size: 12px; color: #333;">Author Name</small>
                    </div>
                </td>
                <!-- Xuống dòng sau mỗi 4 cuốn sách -->
                <th:block th:if="${iterStat.count % 4 == 0}"></th:block>
                    </tr><tr>
                </th:block>
            </th:block>
        </tr>
    </table>

</div>
</html>

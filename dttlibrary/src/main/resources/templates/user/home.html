<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/user-layout :: layout(
          title='Trang chủ',
          content=~{::content})">

<div th:fragment="content">

    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color: navy; text-decoration: underline;">SÁCH MỚI NHẤT</h2>
        <p>Những cuốn sách vừa được cập nhật trong thư viện của chúng tôi!</p>
    </div>

    <!-- SÁCH MỚI -->
    <table border="1" cellpadding="5" cellspacing="0" width="100%" style="background: white; border-color: black;">
        <tr>
            <td th:each="book : ${newBooks}" align="center" valign="top" width="25%">
                <a th:href="@{/user/books/{id}(id=${book.id})}">
                    <img th:if="${book.images != null and !book.images.isEmpty()}"
                         th:src="@{${book.images[0].url}}"
                         width="100" height="150" style="border: 1px solid black; object-fit: cover;">
                    <img th:if="${book.images == null or book.images.isEmpty()}"
                         src="https://via.placeholder.com/100x150?text=No+Image"
                         width="100" height="150" style="border: 1px solid black;">
                </a>
                <br>
                <a th:href="@{/user/books/{id}(id=${book.id})}" style="font-size: 14px; font-weight: bold;" th:text="${book.title}">
                    Book Title
                </a>
                <br>
                <small th:if="${book.author != null}" th:text="${book.author.name}">Author Name</small>
            </td>
        </tr>
    </table>

    <hr style="border-top: 2px dashed navy; margin: 25px 0;">

    <!-- THỂ LOẠI -->
    <div style="text-align: center; margin-bottom: 15px;">
        <h2 style="color: navy; text-decoration: underline;">KHÁM PHÁ THEO THỂ LOẠI</h2>
    </div>

    <div style="background: white; border: 2px inset white; padding: 15px; text-align: center;">
        <th:block th:each="c, iter : ${categories}">
            <a th:href="@{/user/books/category/{slug}(slug=${c.slug})}"
               style="font-size: 16px; font-weight: bold; margin: 5px 10px; display: inline-block;"
               th:text="${c.name}">
                Category Name
            </a>
            <span th:if="${!iter.last}"> | </span>
        </th:block>
    </div>

</div>
</html>

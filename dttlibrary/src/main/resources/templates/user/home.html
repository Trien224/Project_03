<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="content">
        <section class="hero">
            <h1>Chào mừng đến với DTT Library</h1>
            <p>Khám phá kho tri thức – mượn sách dễ dàng, nhanh chóng.</p>
            <a th:href="@{/user/books}" class="btn btn-primary">
                📚 Xem sách
            </a>
        </section>

        <section class="my-5">
            <h3>📖 Sách mới</h3>
            <div class="row">
                <div class="col-md-3" th:each="book : ${newBooks}">
                    <div class="card book-card">
                        <img th:if="${book.images != null and !book.images.isEmpty()}"
                             th:src="@{${book.images[0].url}}"
                             class="img-fluid">
                        <h6 th:text="${book.title}"></h6>
                        <small class="text-muted">
                            Tác giả:
                            <span th:text="${book.author != null ? book.author.name : 'N/A'}"></span>
                        </small>
                        <a th:href="@{/user/books/{id}(id=${book.id})}"
                           class="btn btn-sm">
                            Xem chi tiết
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section class="my-5">
            <h3>📚 Thể loại</h3>
            <div class="row">
                <div class="col-md-3" th:each="c : ${categories}">
                    <div class="category-item" th:text="${c.name}"></div>
                </div>
            </div>
        </section>
    </div>
</div>

</body>
</html>

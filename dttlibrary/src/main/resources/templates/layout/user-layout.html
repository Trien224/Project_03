<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'DTT Library'">DTT Library</title>
    <!-- Bootstrap from WebJars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

    <style>
        /* ===== RETRO USER STYLE ===== */
        body {
            background-color: #008080; /* Teal Windows 95 */
            background-image: url('https://www.transparenttextures.com/patterns/diagmonds-light.png');
            font-family: "Verdana", sans-serif;
            margin: 0;
            padding: 10px;
        }

        /* Khung chính */
        .page-wrapper {
            max-width: 800px;
            margin: 0 auto;
            background-color: #C0C0C0; /* Silver */
            border: 3px outset white;
            padding: 5px;
        }

        /* Header */
        .retro-header {
            background: navy;
            color: white;
            padding: 10px;
            border: 2px inset white;
            margin-bottom: 10px;
            text-align: center;
        }

        /* Navbar */
        .navbar {
            background-color: #C0C0C0;
            border: 2px outset white;
            margin-bottom: 15px;
            padding: 5px;
        }

        .nav-link {
            color: black !important;
            font-weight: bold;
            border: 2px outset white;
            margin-right: 5px;
            background: #D3D3D3;
            padding: 2px 10px;
        }

        .nav-link:active {
            border: 2px inset white;
        }

        .nav-link:hover {
            background: navy;
            color: white !important;
        }

        /* Content Box */
        .content-box {
            background-color: white;
            border: 2px inset white;
            padding: 20px;
            min-height: 400px;
        }

        /* Buttons */
        .btn {
            border-radius: 0 !important;
            border: 2px outset white;
            background-color: #C0C0C0;
            color: black;
            font-weight: bold;
            box-shadow: 2px 2px 0px black;
        }
        .btn:active {
            border: 2px inset white;
            box-shadow: none;
            transform: translate(2px, 2px);
        }
        .btn-primary { background-color: #000080; color: white !important; }
        .btn-danger { background-color: #800000; color: white !important; }

        /* Footer */
        footer {
            margin-top: 10px;
            text-align: center;
            font-size: 11px;
            border-top: 1px solid gray;
            padding-top: 5px;
        }

        /* Loader */
        #loader-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #008080;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            color: white;
            font-family: "Courier New";
        }
    </style>
</head>

<body>

<!-- ===== LOADER ===== -->
<div id="loader-wrapper">
    <img src="https://i.gifer.com/VAyR.gif" width="50">
    <p>CONNECTING...</p>
</div>

<div class="page-wrapper">

    <!-- HEADER -->
    <div class="retro-header">
        <h1>📘 DTT LIBRARY 📘</h1>
        <marquee>Chào mừng bạn đến với thư viện trực tuyến! --- Mượn sách dễ dàng --- Đọc sách mỗi ngày!</marquee>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid p-0">
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/home}">🏠 HOME</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/books}">📚 BOOKS</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/borrowings}">📘 MY BOOKS</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/profile}">👤 PROFILE</a></li>
                </ul>

                <div class="d-flex align-items-center">
                    <span class="me-3 fw-bold" sec:authorize="isAuthenticated()" style="font-size: 12px;">
                        Hello, <span sec:authentication="principal.fullName" style="color: navy;">User</span>
                    </span>
                    <a th:href="@{/logout}" class="btn btn-sm btn-danger">EXIT</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="content-box">
        <div th:replace="${content}"></div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>Copyright © 2000-2025 DTT Library Inc. All rights reserved.</p>
        <p>Powered by Java Spring Boot & Thymeleaf</p>
        <img src="https://www.w3.org/Icons/valid-html401" alt="Valid HTML" height="15">
    </footer>

</div>

<!-- Bootstrap JS from WebJars -->
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>

<script>
    const loader = document.getElementById('loader-wrapper');
    window.addEventListener('load', function() {
        loader.style.display = 'none';
    });
</script>

</body>
</html>

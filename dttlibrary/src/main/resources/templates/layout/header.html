<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DTT Library</title>

    <!-- Google Font for pixelated style -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- ✅ Header Fragment -->
<div th:fragment="header" class="header">
    <h1>📚 DTT Library</h1>
    <nav>
        <a href="/">Trang chủ</a>
        <a href="/books">Sách</a>
        <!-- Logged-in user section -->
        <div th:if="${#authentication.principal != null}" style="display: inline-block;">
            <span>👤 <span th:text="${#authentication.name}">Người dùng</span></span>
            <a href="/my-borrowings">📘 My Borrowings</a>
            <a href="/logout">🚪 Đăng xuất</a>
        </div>
        <!-- Guest user -->
        <div th:if="${#authentication.principal == null}" style="display: inline-block;">
            <a href="/login" class="btn">Đăng nhập</a>
        </div>
    </nav>
</div>

</body>
</html>

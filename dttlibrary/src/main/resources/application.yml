# Cấu hình chung cho tất cả các môi trường
server:
  port: 8080

spring:
  # Cấu hình datasource chung
  datasource:
    url: jdbc:mysql://localhost:3306/dttlibrary?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:trien2005}

  # Cấu hình JPA chung
  jpa:
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  # Kích hoạt profile 'dev' làm mặc định
  profiles:
    active: dev
    
  # Cấu hình cache cho tài nguyên tĩnh
  web:
    resources:
      cache:
        period: 31536000 # Cache trong 1 năm
        cachecontrol:
          max-age: 31536000
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**, /js/**, /webjars/**

---

# Cấu hình dành riêng cho môi trường Development (dev)
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  thymeleaf:
    cache: false

---

# Cấu hình dành riêng cho môi trường Production (prod)
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true

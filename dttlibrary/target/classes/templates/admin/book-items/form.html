<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin | Book Item Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="sidebar">
        <h4>DTT Library</h4>
        <a href="/admin">Dashboard</a>
        <a href="/admin/books">Books</a>
        <a href="/admin/book-items" class="active">Book Items</a>
        <a href="/admin/categories">Categories</a>
        <a href="/admin/authors">Authors</a>
        <a href="/admin/borrowings">Borrowings</a>
        <a href="/admin/users">Users</a>
        <hr>
        <a href="/logout">Logout</a>
    </div>

    <div class="content">
        <h3 th:text="${item.id == null} ? '➕ Add Book Item' : '✏️ Edit Book Item'"></h3>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/admin/book-items/save}" th:object="${item}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>Book</label>
                <select class="form-control" name="bookId" required>
                    <option value="">-- Select book --</option>
                    <option th:each="b : ${books}"
                            th:value="${b.id}"
                            th:text="${b.title}"
                            th:selected="${item.book != null and item.book.id == b.id}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Barcode</label>
                <input class="form-control" th:field="*{barcode}" required>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select class="form-control" th:field="*{status}">
                    <option th:each="s : ${T(com.dttlibrary.model.BookItem.Status).values()}"
                            th:value="${s}"
                            th:text="${s}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Location</label>
                <input class="form-control" th:field="*{location}">
            </div>

            <div>
                <button type="submit" class="btn btn-primary">💾 Save Item</button>
                <a href="/admin/book-items" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

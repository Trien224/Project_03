<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(title='Author Form', content=~{::content})}">

<div th:fragment="content">

    <h3 th:text="${author.id == null} ? '✍️ Add New Author' : '✏️ Edit Author'"></h3>

    <!-- Reusable Messages Fragment -->
    <div th:replace="~{fragments/common-fragments :: messages}"></div>

    <fieldset style="border: 2px inset white; padding: 15px;">
        <legend style="font-size: 16px; font-weight: bold; color: navy;">Author Details</legend>

        <form th:action="@{/admin/authors/save}" th:object="${author}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <table>
                <tr>
                    <td><label for="name">Name:</label></td>
                    <td><input id="name" th:field="*{name}" class="form-control" required size="40"></td>
                </tr>
                <tr>
                    <td valign="top"><label for="bio">Biography:</label></td>
                    <td><textarea id="bio" th:field="*{bio}" class="form-control" rows="5" cols="38"></textarea></td>
                </tr>
            </table>

            <div style="margin-top: 15px;">
                <button type="submit" class="btn">Save Author</button>
                <a href="/admin/authors" class="btn">Cancel</a>
            </div>
        </form>
    </fieldset>

</div>
</html>

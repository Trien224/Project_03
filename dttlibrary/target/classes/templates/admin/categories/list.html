<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(title='Category Management', content=~{::content})}">

<div th:fragment="content">

    <h3>🗂 Category Management</h3>

    <div style="text-align: right; margin-bottom: 10px;">
        <a href="/admin/categories/create" class="btn">+ Add New Category</a>
    </div>

    <!-- Reusable Messages Fragment -->
    <div th:replace="~{fragments/common-fragments :: messages}"></div>

    <table class="table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Slug</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${categories}">
                <td th:text="${c.name}">Category Name</td>
                <td th:text="${c.slug}">slug-example</td>
                <td align="center">
                    <a th:href="@{/admin/categories/edit/{id}(id=${c.id})}" class="btn">Edit</a>
                    <a th:href="@{/admin/categories/delete/{id}(id=${c.id})}" class="btn" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</html>

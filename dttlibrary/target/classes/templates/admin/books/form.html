<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(title='Book Form', content=~{::content})}">

<div th:fragment="content">

    <h3 th:text="${book.id == null} ? '➕ Add New Book' : '✏️ Edit Book'"></h3>

    <!-- Reusable Messages Fragment -->
    <div th:replace="~{fragments/common-fragments :: messages}"></div>

    <!-- Book Information Form -->
    <fieldset style="border: 2px inset white; padding: 15px; margin-bottom: 20px;">
        <legend style="font-size: 16px; font-weight: bold; color: navy;">Book Information</legend>
        <form th:action="@{/admin/books/save}" th:object="${book}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}" />
            <table>
                <tr>
                    <td><label for="title">Title:</label></td>
                    <td><input id="title" th:field="*{title}" class="form-control" required size="50"></td>
                </tr>
                <tr>
                    <td valign="top"><label for="description">Description:</label></td>
                    <td><textarea id="description" th:field="*{description}" class="form-control" rows="3" cols="48"></textarea></td>
                </tr>
                <tr>
                    <td><label for="categoryId">Category:</label></td>
                    <td>
                        <select id="categoryId" name="categoryId" class="form-select" required>
                            <option value="">-- Select --</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${book.category != null and book.category.id == c.id}"></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="authorId">Author:</label></td>
                    <td>
                        <select id="authorId" name="authorId" class="form-select">
                            <option value="">-- Select --</option>
                            <option th:each="a : ${authors}" th:value="${a.id}" th:text="${a.name}" th:selected="${book.author != null and book.author.id == a.id}"></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="publisherId">Publisher:</label></td>
                    <td>
                        <select id="publisherId" name="publisherId" class="form-select">
                            <option value="">-- Select --</option>
                            <option th:each="p : ${publishers}" th:value="${p.id}" th:text="${p.name}" th:selected="${book.publisher != null and book.publisher.id == p.id}"></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="isbn">ISBN:</label></td>
                    <td><input id="isbn" th:field="*{isbn}" class="form-control"></td>
                </tr>
                <tr>
                    <td><label for="publishedYear">Published Year:</label></td>
                    <td><input id="publishedYear" type="number" th:field="*{publishedYear}" class="form-control" style="width: 120px;"></td>
                </tr>
                <tr>
                    <td><label for="numberOfPages">Pages:</label></td>
                    <td><input id="numberOfPages" type="number" th:field="*{numberOfPages}" class="form-control" style="width: 120px;"></td>
                </tr>
                <tr>
                    <td><label for="language">Language:</label></td>
                    <td><input id="language" th:field="*{language}" class="form-control"></td>
                </tr>
                <tr th:if="${book.id == null}">
                    <td><label for="initialQuantity">Initial Quantity:</label></td>
                    <td><input id="initialQuantity" type="number" name="initialQuantity" class="form-control" value="1" min="0" style="width: 120px;"></td>
                </tr>
                <tr>
                    <td><label for="image">Image:</label></td>
                    <td><input id="image" type="file" name="image" class="form-control"></td>
                </tr>
            </table>
            <div style="margin-top: 15px;">
                <button type="submit" class="btn">Save Book</button>
                <a href="/admin/books" class="btn">Back to List</a>
            </div>
        </form>
    </fieldset>

    <!-- Book Items Management (Only for existing books) -->
    <fieldset th:if="${book.id != null}" style="border: 2px inset white; padding: 15px;">
        <legend style="font-size: 16px; font-weight: bold; color: navy;">Book Items (Copies)</legend>
        <div style="border: 1px solid gray; padding: 10px; margin-bottom: 10px;">
            <form th:action="@{/admin/books/add-copies/{bookId}(bookId=${book.id})}" method="post" style="display: inline-block;">
                <label for="quantityToAdd">Add more copies:</label>
                <input id="quantityToAdd" type="number" name="quantityToAdd" class="form-control" value="1" min="1" style="width: 70px; display: inline-block;">
                <button type="submit" class="btn">Add</button>
            </form>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th>Barcode</th>
                    <th>Status</th>
                    <th>Location</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${book.bookItems == null or book.bookItems.isEmpty()}">
                    <td colspan="4" align="center">This book has no items yet.</td>
                </tr>
                <tr th:each="item : ${book.bookItems}">
                    <td th:text="${item.barcode}"></td>
                    <td th:text="${item.status}"></td>
                    <td th:text="${item.location}"></td>
                    <td align="center">
                        <a th:href="@{/admin/book-items/edit/{id}(id=${item.id})}" class="btn">Edit</a>
                        <a th:href="@{/admin/book-items/delete/{id}(id=${item.id}, bookId=${book.id})}" class="btn" onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </fieldset>

</div>
</html>

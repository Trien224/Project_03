<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(title='Book Management', content=~{::content})}">

<div th:fragment="content">

    <h3>📚 Book Management</h3>

    <div style="text-align: right; margin-bottom: 10px;">
        <a href="/admin/books/create" class="btn">+ Add New Book</a>
    </div>

    <!-- Reusable Messages Fragment -->
    <div th:replace="~{fragments/common-fragments :: messages}"></div>

    <table class="table">
        <thead>
            <tr>
                <th>Image</th>
                <th>Title</th>
                <th>Category</th>
                <th>Author</th>
                <th>Publisher</th>
                <th>Quantity (Avail/Total)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="b : ${books}">
                <td>
                    <img th:if="${b.images != null and !b.images.isEmpty()}"
                         th:src="@{${b.images[0].url}}"
                         width="40" height="60" style="border: 1px solid black; object-fit: cover;"/>
                    <span th:if="${b.images == null or b.images.isEmpty()}">-</span>
                </td>
                <td th:text="${b.title}">Book Title</td>
                <td th:text="${b.category?.name}">Category</td>
                <td th:text="${b.author?.name}">Author</td>
                <td th:text="${b.publisher?.name}">Publisher</td>
                <td align="center">
                    <span th:text="${b.getAvailableItems()}"></span> /
                    <span th:text="${b.getTotalItems()}"></span>
                </td>
                <td align="center">
                    <a th:href="@{/admin/books/edit/{id}(id=${b.id})}" class="btn">Edit</a>
                    <a th:href="@{/admin/books/delete/{id}(id=${b.id})}" class="btn" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</html>

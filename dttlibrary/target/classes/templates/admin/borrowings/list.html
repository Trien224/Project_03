<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(title='Borrowing Management', content=~{::content})}">

<div th:fragment="content">

    <h3>📖 Borrowing Management</h3>

    <!-- Reusable Messages Fragment -->
    <div th:replace="~{fragments/common-fragments :: messages}"></div>

    <table class="table">
        <thead>
            <tr>
                <th>User</th>
                <th>Book Title</th>
                <th>Barcode</th>
                <th>Borrow Date</th>
                <th>Due Date</th>
                <th>Return Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="b : ${borrowings}">
                <td th:text="${b.user?.username}"></td>
                <td th:text="${b.bookItem?.book?.title}"></td>
                <td th:text="${b.bookItem?.barcode}"></td>
                <td th:text="${#temporals.format(b.borrowDate, 'dd/MM/yy')}"></td>
                <td th:text="${#temporals.format(b.dueDate, 'dd/MM/yy')}"></td>
                <td th:text="${b.returnDate != null ? #temporals.format(b.returnDate, 'dd/MM/yy') : '-'}"></td>
                <td th:text="${b.status}"
                    th:style="${b.status.name() == 'overdue' ? 'color:red; font-weight:bold;' : ''}">
                </td>
                <td align="center">
                    <a th:if="${b.status.name() == 'borrowed' or b.status.name() == 'overdue'}"
                       th:href="@{/admin/borrowings/return/{id}(id=${b.id})}"
                       class="btn" onclick="return confirm('Mark this item as returned?')">
                        Return
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/../layout/user-layout :: layout(title='Chỉnh sửa thông tin', content=~{::content})}">

<div th:fragment="content">

    <h2 style="color: navy; text-align: center; text-decoration: underline; margin-bottom: 20px;">✏️ CHỈNH SỬA THÔNG TIN</h2>

    <fieldset style="border: 1px inset white; padding: 20px;">
        <legend style="font-size: 16px; font-weight: bold;">Cập nhật thông tin của bạn</legend>

        <form th:action="@{/user/profile/update}" th:object="${user}" method="post">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{username}" />

            <table cellpadding="5">
                <tr>
                    <td width="150"><label for="fullName">Họ và tên:</label></td>
                    <td><input type="text" id="fullName" th:field="*{fullName}" required size="40" style="border: 1px solid black;"></td>
                </tr>
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td><input type="email" id="email" th:field="*{email}" required size="40" style="border: 1px solid black;"></td>
                </tr>
                <tr>
                    <td><label for="phone">Số điện thoại:</label></td>
                    <td><input type="text" id="phone" th:field="*{phone}" size="40" style="border: 1px solid black;"></td>
                </tr>
            </table>

            <hr style="border-top: 1px dashed gray; margin: 20px 0;">

            <div>
                <button type="submit" class="btn btn-primary">💾 Lưu thay đổi</button>
                <a th:href="@{/user/profile}" class="btn">Hủy</a>
            </div>
        </form>
    </fieldset>

</div>
</html>

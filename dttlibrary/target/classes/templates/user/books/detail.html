<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/../layout/user-layout :: layout(title=${book.title}, content=~{::content})}">

<div th:fragment="content">

    <h2 style="color: navy; text-align: center; text-decoration: underline; margin-bottom: 20px;" th:text="${book.title}"></h2>

    <table width="100%" cellpadding="10">
        <tr>
            <td width="35%" valign="top" align="center">
                <!-- Book Cover -->
                <img th:if="${primaryImage != null}"
                     th:src="@{${primaryImage.url}}"
                     width="200" style="border: 2px outset white;">
                <img th:if="${primaryImage == null}"
                     src="https://via.placeholder.com/200x300?text=No+Image"
                     width="200" style="border: 2px outset white;">

                <hr style="border-top: 1px dashed gray; margin: 15px 0;">

                <!-- Borrowing Section -->
                <div style="border: 1px solid gray; padding: 10px; background: #D3D3D3;">
                    <p style="margin: 0; font-weight: bold;">Số lượng còn lại:
                        <span th:text="${available}" style="color: green; font-size: 18px;"></span>
                    </p>
                    <div style="margin-top: 10px;">
                        <div th:if="${available > 0 and availableItem != null}">
                            <form th:action="@{/borrowings/borrow}" method="post">
                                <input type="hidden" name="bookItemId" th:value="${availableItem.id}" />
                                <button type="submit" class="btn btn-primary">📖 Mượn sách ngay</button>
                            </form>
                        </div>
                        <div th:if="${available == 0}">
                            <button class="btn" disabled>❌ Hết sách</button>
                        </div>
                    </div>
                </div>
            </td>
            <td width="65%" valign="top" style="font-size: 14px;">
                <!-- Book Details -->
                <fieldset style="border: 1px inset white; padding: 15px;">
                    <legend style="font-size: 16px; font-weight: bold;">Thông tin chi tiết</legend>
                    <p><b>Tác giả:</b> <span th:text="${book.author?.name ?: 'N/A'}"></span></p>
                    <p><b>Thể loại:</b> <span th:text="${book.category?.name ?: 'N/A'}"></span></p>
                    <p><b>Nhà xuất bản:</b> <span th:text="${book.publisher?.name ?: 'N/A'}"></span></p>
                    <p><b>Năm xuất bản:</b> <span th:text="${book.publishedYear ?: 'N/A'}"></span></p>
                    <p><b>Số trang:</b> <span th:text="${book.numberOfPages ?: 'N/A'}"></span></p>
                    <p><b>Ngôn ngữ:</b> <span th:text="${book.language ?: 'N/A'}"></span></p>
                    <p><b>ISBN:</b> <span th:text="${book.isbn ?: 'N/A'}"></span></p>
                </fieldset>

                <br>

                <fieldset style="border: 1px inset white; padding: 15px;">
                    <legend style="font-size: 16px; font-weight: bold;">Mô tả</legend>
                    <p th:text="${book.description ?: 'Chưa có mô tả.'}" style="text-align: justify;"></p>
                </fieldset>
            </td>
        </tr>
    </table>

    <hr style="border-top: 2px solid navy; margin: 20px 0;">
    <div style="text-align: center;">
        <a href="javascript:history.back()" class="btn">⬅️ Quay lại</a>
        <a th:href="@{/user/books}" class="btn">📚 Xem tất cả sách</a>
    </div>

</div>
</html>

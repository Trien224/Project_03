<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/../layout/user-layout :: layout(title='Đổi mật khẩu', content=~{::content})}">

<div th:fragment="content">

    <h2 style="color: navy; text-align: center; text-decoration: underline; margin-bottom: 20px;">🔑 ĐỔI MẬT KHẨU</h2>

    <!-- Messages -->
    <div th:if="${successMessage}" style="color: green; border: 1px solid green; padding: 5px; margin-bottom: 10px; background: #e8f5e9;" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" style="color: red; border: 1px solid red; padding: 5px; margin-bottom: 10px; background: #ffebee;" th:text="${errorMessage}"></div>

    <fieldset style="border: 1px inset white; padding: 20px;">
        <legend style="font-size: 16px; font-weight: bold;">Bảo mật tài khoản</legend>

        <form th:action="@{/user/profile/change-password}" method="post">
            <table cellpadding="5">
                <tr>
                    <td width="200"><label for="currentPassword">Mật khẩu hiện tại:</label></td>
                    <td><input type="password" id="currentPassword" name="currentPassword" required size="30" style="border: 1px solid black;"></td>
                </tr>
                <tr>
                    <td><label for="newPassword">Mật khẩu mới:</label></td>
                    <td><input type="password" id="newPassword" name="newPassword" required size="30" style="border: 1px solid black;"></td>
                </tr>
                <tr>
                    <td><label for="confirmPassword">Xác nhận mật khẩu mới:</label></td>
                    <td><input type="password" id="confirmPassword" name="confirmPassword" required size="30" style="border: 1px solid black;"></td>
                </tr>
            </table>

            <hr style="border-top: 1px dashed gray; margin: 20px 0;">

            <div>
                <button type="submit" class="btn btn-primary">💾 Đổi mật khẩu</button>
                <a th:href="@{/user/profile}" class="btn">Hủy</a>
            </div>
        </form>
    </fieldset>

</div>
</html>

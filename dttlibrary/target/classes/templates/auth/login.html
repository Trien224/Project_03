<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - DTT Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ===== RETRO LOGIN STYLE ===== */
        body {
            background-color: #008080; /* Teal */
            font-family: "MS Sans Serif", "Verdana", sans-serif;
            font-size: 14px;
        }

        .login-dialog {
            width: 350px;
            background-color: #C0C0C0; /* Silver */
            border: 2px outset white;
            padding: 3px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
        }

        .dialog-title-bar {
            background: navy;
            color: white;
            padding: 3px 5px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dialog-title-bar .close-button {
            background-color: #C0C0C0;
            border: 1px outset white;
            color: black;
            font-family: "MS Sans Serif", sans-serif;
            font-weight: bold;
            width: 16px;
            height: 14px;
            line-height: 12px;
            text-align: center;
        }

        .dialog-content {
            padding: 20px;
            display: flex;
            align-items: center;
        }

        .dialog-icon {
            width: 48px;
            height: 48px;
            margin-right: 20px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: inline-block;
            width: 80px;
        }

        .form-control-retro {
            border: 2px inset white;
            background-color: white;
            padding: 3px;
            width: calc(100% - 90px);
        }

        .button-pane {
            text-align: center;
            margin-top: 20px;
        }

        .btn-retro {
            background-color: #C0C0C0;
            border: 2px outset white;
            color: black;
            font-weight: bold;
            padding: 3px 20px;
            text-decoration: none;
            margin: 0 5px;
        }

        .btn-retro:active {
            border: 2px inset white;
        }

        .message-box {
            margin-top: 15px;
            font-size: 12px;
            text-align: center;
        }

        .register-link {
            margin-top: 15px;
            font-size: 12px;
            text-align: center;
        }
        .register-link a {
            color: blue;
        }
    </style>
</head>

<body>

<div class="login-dialog">
    <!-- Title Bar -->
    <div class="dialog-title-bar">
        <span>Enter Password</span>
        <div class="close-button">X</div>
    </div>

    <!-- Content -->
    <div class="dialog-content">
        <img src="https://win98icons.alexmeub.com/icons/png/key_win-4.png" alt="Key Icon" class="dialog-icon">

        <div style="width: 100%;">
            <p style="margin-bottom: 15px;">Please enter your username and password to access the DTT Library system.</p>

            <form method="post" action="/login" novalidate>
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input id="username" name="username" type="text" class="form-control-retro" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input id="password" name="password" type="password" class="form-control-retro" required>
                </div>

                <div class="button-pane">
                    <button type="submit" class="btn-retro">OK</button>
                    <button type="button" class="btn-retro" onclick="window.location.href='/'">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div style="padding: 0 20px 10px 20px;">
        <!-- Register Link -->
        <div class="register-link">
            Don't have an account? <a href="/register">Click here to register!</a>
        </div>

        <!-- Messages -->
        <div class="message-box">
            <div style="color: red;" th:if="${param.error}">
                <img src="https://win98icons.alexmeub.com/icons/png/msg_error-0.png" width="16" style="vertical-align: middle;">
                Incorrect username or password.
            </div>
            <div style="color: navy;" th:if="${param.logout}">
                <img src="https://win98icons.alexmeub.com/icons/png/msg_info-4.png" width="16" style="vertical-align: middle;">
                You have been logged out.
            </div>
            <div style="color: navy;" th:if="${param.register_success}">
                <img src="https://win98icons.alexmeub.com/icons/png/msg_info-4.png" width="16" style="vertical-align: middle;">
                Registration successful! Please log in.
            </div>
        </div>
    </div>
</div>

</body>
</html>

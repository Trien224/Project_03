<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.title}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container-fluid">
    <div class="content">
        <div class="detail-container">
            <div class="row">
                <div class="col-md-4">
                    <img th:if="${primaryImage != null}" th:src="@{${primaryImage.url}}" class="img-fluid">
                    <img th:if="${primaryImage == null}" src="https://via.placeholder.com/300x450?text=No+Image" class="img-fluid">
                </div>
                <div class="col-md-8">
                    <h2 th:text="${book.title}"></h2>
                    <p><b>Tác giả:</b> <span th:text="${book.author?.name ?: 'N/A'}"></span></p>
                    <p><b>Thể loại:</b> <span th:text="${book.category?.name ?: 'N/A'}"></span></p>
                    <p><b>Năm xuất bản:</b> <span th:text="${book.publishedYear}"></span></p>
                    <hr>
                    <p><b>Số lượng còn lại:</b> <span th:text="${available}"></span></p>

                    <div th:if="${available > 0}">
                        <a th:href="@{/login}" class="btn btn-primary">
                            🔐 Đăng nhập để mượn
                        </a>
                    </div>
                    <div th:if="${available == 0}">
                        <button class="btn" disabled>❌ Hết sách</button>
                    </div>

                    <h5 class="mt-5">Mô tả</h5>
                    <p th:text="${book.description}"></p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
